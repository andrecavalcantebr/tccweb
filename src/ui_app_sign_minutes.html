<!DOCTYPE html>
<html>
  <head>
    <?!= include('ui_styles') ?>
  </head>
  <body>
    <div style="display:none;"><?!= include('ui_asset_logo1') ?></div>

    <!-- Valores do servidor em ATRIBUTO, nunca interpolados numa string JS: o
         escape do scriptlet de impressão é contextual e, quando se perde,
         devolve o valor já entre aspas, quebrando o bloco inteiro. E um nome
         com apóstrofo escaparia da string de qualquer jeito (rationale 7.9).
         Ver rationale 7.11. -->
    <div id="serverData" hidden
         data-proposal-id="<?= proposalId ?>"
         data-student-name="<?= studentName ?>"
         data-app-url="<?= ScriptApp.getService().getUrl() ?>"></div>

    <div class="flex-center">
      <div class="container card" style="max-width:720px;">
        <div style="text-align:center; margin-bottom:20px;">
          <img id="logo1" height="120" />
        </div>

        <div id="doneBox" style="display:none;">
          <h2>Assinatura registrada</h2>
          <p style="color:var(--secondary-color);font-size:14px;">
            Obrigado. A sua assinatura na Ata da defesa de
            <strong><?= studentName ?></strong> foi registrada.
          </p>
          <div style="margin-top:24px;text-align:center;">
            <button class="btn btn-primary"
                    onclick="goToApp()">
              Ir para o sistema
            </button>
          </div>
        </div>

        <div id="signBox">
          <h2>Assinar a Ata da Defesa</h2>
          <p style="color:var(--secondary-color);font-size:14px;">
            Você foi convidado(a) como membro da banca de
            <strong><?= studentName ?></strong>. Confira os dados abaixo — as notas
            e o parecer registrados agora são exatamente o que a sua assinatura
            carimba — e assine.
          </p>

          <div id="minutes"></div>

          <div id="signError" style="display:none;margin-top:16px;padding:12px;
               background:#fdecea;border:1px solid #f44336;border-radius:8px;">
            <p id="signErrorMsg" style="margin:0;font-size:14px;color:#c62828;"></p>
          </div>

          <div class="actions-bar" style="box-shadow:none;padding:0;margin-top:20px;">
            <button class="btn btn-primary" id="btnSign" onclick="sign(this)">Assinar a Ata</button>
          </div>
        </div>
      </div>
    </div>

    <?!= include('ui_scripts') ?>

    <script>
      document.getElementById('logo1').src = AppAssets['logo1'];

      const defense = <?!= defenseJson ?>;
      const srv = document.getElementById('serverData').dataset;
      const proposalId = srv.proposalId;

      function goToApp() {
        window.top.location.href = srv.appUrl;
      }

      document.getElementById('minutes').innerHTML = renderMinutesSummary(defense);

      function sign(btn) {
        appConfirm('Assinar a Ata da defesa de ' + srv.studentName + '?').then(ok => {
          if (!ok) return;
          const done = beginBusy(btn, 'Assinando…');
          google.script.run
            .withSuccessHandler(res => {
              done();
              if (res && res.success) {
                // Trocado aqui mesmo, sem recarregar: o token é de uso único e
                // acabou de ser consumido, então repetir esta URL não acharia
                // mais nada e cairia numa tela de erro depois do sucesso.
                document.getElementById('signBox').style.display = 'none';
                document.getElementById('doneBox').style.display = 'block';
              } else {
                document.getElementById('signErrorMsg').innerText = res ? res.msg : 'Erro desconhecido.';
                document.getElementById('signError').style.display = 'block';
              }
            })
            .withFailureHandler(err => {
              done();
              document.getElementById('signErrorMsg').innerText = 'Erro técnico: ' + err.message;
              document.getElementById('signError').style.display = 'block';
            })
            .cmdSignMinutes(proposalId);
        });
      }
    </script>
  </body>
</html>
